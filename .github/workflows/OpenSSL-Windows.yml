name: OpenSSL-Windows
on:
  workflow_dispatch:
    inputs:
      tcl-tags:
        required: true
        type: choice
        options:
          - '["9.0"]'
          - '["9.1"]'
          - '["main"]'
        default: '["main"]'

permissions:
  contents: write
env:
  ERROR_ON_FAILURES: 1

jobs:
  build-openssl:
    runs-on: windows-2025
    defaults:
      run:
        shell: powershell

    strategy:
      matrix:
        config:
          - ""
        tcl-tag: ${{ fromJSON(github.event.inputs.tcl-tags) }}

    steps:
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.42"
          distribution: strawberry
          install-modules-with: cpanm
          install-modules-args: --with-develop --with-configure
      - uses: ilammy/setup-nasm@v1

      - name: Checkout
        uses: actions/checkout@v6
        timeout-minutes: 5

      - name: Set variables
        run: |

          $tag = '${{ matrix.tcl-tag }}'
          $varsFile = ".github/build-vars-tcl-$tag.json"

          echo "Loading build variables from $varsFile"
          if (-not (Test-Path $varsFile)) {
            throw "Build vars file not found: $varsFile"
          }
          $vars = Get-Content $varsFile | ConvertFrom-Json
          foreach ($prop in $vars.PSObject.Properties) {
            if ( $prop.Name -match "OSSL_.*" ) {
                echo "Setting $($prop.Name)=$($prop.Value)"
                Add-Content -Path $env:GITHUB_ENV -Value "$($prop.Name)=$($prop.Value)"
            }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "SSL_INSTALL_FOLDER=C:\OpenSSL"

      - name: Download OpenSSL source
        run: |
          echo "Downloading $Env:OSSL_DOWNLOAD_URL to $Env:OSSL_DOWNLOAD_FILE"
          curl.exe -L --ssl-no-revoke -o $Env:OSSL_DOWNLOAD_FILE $Env:OSSL_DOWNLOAD_URL
          if ($LASTEXITCODE -ne 0) {
              throw "curl failed (exit code $LASTEXITCODE) downloading OpenSSL source"
          }

      - name: Verify download
        run: |
          if ( $Env:OSSL_DOWNLOAD_HASH -ne "SKIP" ) {
              $FileHash = (Get-FileHash $Env:OSSL_DOWNLOAD_FILE -Algorithm MD5).HASH
              if ( $FileHash -ne $Env:OSSL_DOWNLOAD_HASH ) {
                  throw "MD5 hash check failed for $Env:OSSL_DOWNLOAD_FILE"
              }
          }

      - name: Extract source
        run: |
          tar -zxf $Env:OSSL_DOWNLOAD_FILE
          if ($lastexitcode -ne 0) { throw "tar exit code: $lastexitcode" }
          dir

      - name: Init MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Build and install OpenSSL
        run: |
          try {
              Push-Location $Env:OSSL_BUILD_DIR
              &perl Configure VC-WIN64A no-shared no-filenames threads no-ssl3 --api=1.1.0 --prefix="$Env:SSL_INSTALL_FOLDER" --openssldir="$Env:SSL_INSTALL_FOLDER" -DOPENSSL_NO_DEPRECATED
              if ($lastexitcode -ne 0) { throw "perl Configure OSSL exit code: $lastexitcode" }
              &nmake
              if ($lastexitcode -ne 0) { throw "nmake OSSL exit code: $lastexitcode" }
              &nmake install
              if ($lastexitcode -ne 0) { throw "nmake install OSSL exit code: $lastexitcode" }
          }
          finally {
              Pop-Location
          }

      - name: Package OpenSSL build
        run: |
          Compress-Archive -Path "$Env:SSL_INSTALL_FOLDER\*" -DestinationPath "$Env:OSSL_BUILD_DIR.zip" -Force

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "$Env:OSSL_BUILD_DIR-build-cache"

          gh release view $tag 2>&1 | Out-Null
          if ($lastexitcode -eq 0) {
            echo "Existing release found for tag $tag, deleting it"
            gh release delete $tag --yes --cleanup-tag
            if ($lastexitcode -ne 0) {
              echo "gh release delete failed with exit code: $lastexitcode"
              echo "Forging ahead anyway..."
            }
          } else {
            echo "No existing release for tag $tag, nothing to delete"
          }
          
          gh release create $tag `
            $Env:OSSL_BUILD_DIR.zip `
            --draft `
            --title "OpenSSL Windows build cache (internal)" `
            --notes "Internal build cache used by Windows.yml. Not a project release. Source: $Env:OSSL_DOWNLOAD_URL"

          if ($lastexitcode -ne 0) {
            throw "gh release create failed with exit code: $lastexitcode"
          }
