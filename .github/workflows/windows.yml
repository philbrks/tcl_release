name: Windows
on:
  workflow_dispatch:
    inputs:
      tcl-tags:
        required: true
        type: choice
        options:
          - '["core-9-0-3"]'
          - '["core-9-1-a1"]'
          - '["main"]'
        default: '["main"]'

permissions:
  contents: read
env:
  ERROR_ON_FAILURES: 1
jobs:
  msvc:
    runs-on: windows-2025
    defaults:
      run:
        shell: powershell
        # Using powershell means we need to explicitly stop on failure

    strategy:
      matrix:
        config:
          - ""
          # - "OPTS=symbols"
          # - "OPTS=static"
        tcl-tag: ${{ fromJSON(github.event.inputs.tcl-tags) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        timeout-minutes: 5

      - name: Prepare
        run: |
          mkdir "C:\Tcl-tk"
          # Common Tcl/Tk Settings
          Add-Content -Path $env:GITHUB_ENV -Value "INSTALLDIR=C:\Tcl-tk"
          Add-Content -Path $env:GITHUB_ENV -Value "TCL_APP_GUID=B4D6AEFE-3B8C-4B64-B1BD-B45A3442A79C"
          Add-Content -Path $env:GITHUB_ENV -Value "TCL_DOWNLOAD_DIR=http://prdownloads.sourceforge.net/tcl/"
          Add-Content -Path $env:GITHUB_ENV -Value "TCLLIB_DOWNLOAD_DIR=http://prdownloads.sourceforge.net/tcllib/"
          Add-Content -Path $env:GITHUB_ENV -Value "TCLTLS_DOWNLOAD_DIR=https://core.tcl-lang.org/tcltls/tarball/"
 
          if ( '${{ matrix.tcl-tag }}' -match 'core-9-0-3' ) {
            # Tcl and Tk settings
            Add-Content -Path $env:GITHUB_ENV -Value "TCLSH=C:\Tcl-tk\bin\tclsh90.exe"
            Add-Content -Path $env:GITHUB_ENV -Value "TCL_VERSION=9.0.3"
            Add-Content -Path $env:GITHUB_ENV -Value "TCL_MAJOR_MINOR=9.0"
            Add-Content -Path $env:GITHUB_ENV -Value "TCL_DOWNLOAD_FILE=tcl9.0.3-src.tar.gz"
            Add-Content -Path $env:GITHUB_ENV -Value "TCL_DOWNLOAD_HASH=820AEED1E4E1A89038D0302D2F839E84"
            Add-Content -Path $env:GITHUB_ENV -Value "TK_DOWNLOAD_FILE=tk9.0.3-src.tar.gz"
            Add-Content -Path $env:GITHUB_ENV -Value "TK_DOWNLOAD_HASH=72F9C4005EAAF3B9C994BDA74324C28E"
            Add-Content -Path $env:GITHUB_ENV -Value "TCL_BUILD_DIR=tcl9.0.3"

          } elseif ( '${{ matrix.tcl-tag }}' -match 'core-9-1-.*' ) {
            Add-Content -Path $env:GITHUB_ENV -Value "TCLSH=C:\Tcl-tk\bin\tclsh91.exe"
            Add-Content -Path $env:GITHUB_ENV -Value "TCL_VERSION=9.1.a1"
            Add-Content -Path $env:GITHUB_ENV -Value "TCL_MAJOR_MINOR=9.1"
            Add-Content -Path $env:GITHUB_ENV -Value "TCL_DOWNLOAD_FILE=tcl9.1a1-src.tar.gz"
            Add-Content -Path $env:GITHUB_ENV -Value "TCL_DOWNLOAD_HASH=DFAF19E2D9CA72A91EED1B90C189ABAA"
            Add-Content -Path $env:GITHUB_ENV -Value "TK_DOWNLOAD_FILE=tk9.1a1-src.tar.gz"
            Add-Content -Path $env:GITHUB_ENV -Value "TK_DOWNLOAD_HASH=4AA84FD5DC39F0544FDEF1535AEE0189"
            Add-Content -Path $env:GITHUB_ENV -Value "TCL_BUILD_DIR=tcl9.1a1"
          } elseif ( '${{ matrix.tcl-tag }} ' -match 'main' ) {
            Add-Content -Path $env:GITHUB_ENV -Value "TCLSH=C:\Tcl-tk\bin\tclsh91.exe"
            Add-Content -Path $env:GITHUB_ENV -Value "TCL_VERSION=9.1.main"
            Add-Content -Path $env:GITHUB_ENV -Value "TCL_MAJOR_MINOR=9.1"
            Add-Content -Path $env:GITHUB_ENV -Value "TCL_DOWNLOAD_FILE=tcl-main.tar.gz"
            Add-Content -Path $env:GITHUB_ENV -Value "TCL_BUILD_DIR=tcl-main"
            Add-Content -Path $env:GITHUB_ENV -Value "TK_DOWNLOAD_FILE=tk-main.tar.gz"
            Add-Content -Path $env:GITHUB_ENV -Value "TK_BUILD_DIR=tk-main"
            Add-Content -Path $env:GITHUB_ENV -Value "IMG_DOWNLOAD_FILE=Img-2.1.1.tar.gz"
            Add-Content -Path $env:GITHUB_ENV -Value "IMG_BUILD_DIR=Img-2.1.1"
            Add-Content -Path $env:GITHUB_ENV -Value "TDOM_DOWNLOAD_FILE=tDom-0-9-6.tar.gz"
            Add-Content -Path $env:GITHUB_ENV -Value "TDOM_BUILD_DIR=tDom-0-9-6"
          } else {
            throw "Unable to set values for TCLSH build variables"
          }
          # Common library settings
          # For now, tcllib and tklib must be built at the top level instead of in the tcl.../pkgs directory
          Add-Content -Path $env:GITHUB_ENV -Value "TCLLIB_BUILD_DIR=tcllib-2.0"
          Add-Content -Path $env:GITHUB_ENV -Value "TKLIB_BUILD_DIR=tklib-0.9"
          
          Add-Content -Path $env:GITHUB_ENV -Value "TCLLIB_DOWNLOAD_FILE=tcllib-2.0.tar.gz"
          Add-Content -Path $env:GITHUB_ENV -Value "TCLLIB_VERSION=2.0"
          Add-Content -Path $env:GITHUB_ENV -Value "TCLLIB_DOWNLOAD_HASH=7A6583B88160FE2040FAB74309881C3E"
          
          Add-Content -Path $env:GITHUB_ENV -Value "TKLIB_DOWNLOAD_FILE=tklib-0.9.tar.gz"
          Add-Content -Path $env:GITHUB_ENV -Value "TKLIB_VERSION=0.9"
          Add-Content -Path $env:GITHUB_ENV -Value "TKLIB_DOWNLOAD_HASH=650A65B431987EB1AFC4481D91B9CF0F"

          Add-Content -Path $env:GITHUB_ENV -Value "TCLTLS_DOWNLOAD_FILE=tcltls-tls-2-0.tar.gz"
          Add-Content -Path $env:GITHUB_ENV -Value "TCLTLS_VERSION=2.0"
          Add-Content -Path $env:GITHUB_ENV -Value "TCLTLS_DOWNLOAD_HASH=D648CD998DE10048FB640F6208C0220A"

        working-directory: .

      - name: Download Tcl source
        shell: powershell
        run: |
          function Invoke-Curl {
              param(
                  [string]$OutputFile,
                  [string]$Url,
                  [string[]]$ExtraArgs = @()
              )
              echo "Downloading $Url"
              curl.exe @ExtraArgs -o $OutputFile $Url
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "curl failed (exit code $LASTEXITCODE) downloading '$Url' to '$OutputFile'"
                  throw $LASTEXITCODE
              }
          }

          if ('${{ matrix.tcl-tag }} ' -match 'main') {
              Invoke-Curl -ExtraArgs @('-L', '--ssl-no-revoke') -OutputFile '${{ env.TCL_DOWNLOAD_FILE }}'  -Url 'https://core.tcl-lang.org/tcl/tarball/${{ env.TCL_DOWNLOAD_FILE }}'
              Invoke-Curl -ExtraArgs @('-L', '--ssl-no-revoke') -OutputFile '${{ env.TK_DOWNLOAD_FILE }}'   -Url 'https://core.tcl-lang.org/tk/tarball/${{ env.TK_DOWNLOAD_FILE }}'
              Invoke-Curl -ExtraArgs @('-L', '--ssl-no-revoke') -OutputFile 'itcl-main.tar.gz'              -Url 'https://core.tcl-lang.org/itcl/tarball/itcl-main.tar.gz'
              Invoke-Curl -ExtraArgs @('-L', '--ssl-no-revoke') -OutputFile 'tdbc-main.tar.gz'              -Url 'https://core.tcl-lang.org/tdbc/tarball/tdbc-main.tar.gz'
              Invoke-Curl -ExtraArgs @('-L', '--ssl-no-revoke') -OutputFile 'tdbcodbc-main.tar.gz'          -Url 'https://core.tcl-lang.org/tdbcodbc/tarball/tdbcodbc-main.tar.gz'
              Invoke-Curl -ExtraArgs @('-L', '--ssl-no-revoke') -OutputFile 'tdbcmysql-main.tar.gz'         -Url 'https://core.tcl-lang.org/tdbcmysql/tarball/tdbcmysql-main.tar.gz'
              Invoke-Curl -ExtraArgs @('-L', '--ssl-no-revoke') -OutputFile 'tdbcsqlite3-main.tar.gz'       -Url 'https://core.tcl-lang.org/tdbcsqlite3/tarball/tdbcsqlite3-main.tar.gz'
              Invoke-Curl -ExtraArgs @('-L', '--ssl-no-revoke') -OutputFile 'tdbcpostgres-main.tar.gz'      -Url 'https://core.tcl-lang.org/tdbcpostgres/tarball/tdbcpostgres-main.tar.gz'
              Invoke-Curl -ExtraArgs @('-L', '--ssl-no-revoke') -OutputFile 'thread-main.tar.gz'            -Url 'https://core.tcl-lang.org/thread/tarball/thread-main.tar.gz'
              Invoke-Curl -ExtraArgs @('-L', '--ssl-no-revoke') -OutputFile 'sqlite3-main.tar.gz'           -Url 'https://cyqlite.sourceforge.io/cgi-bin/sqlite/tarball/sqlite3-main.tar.gz'
          } else {
              Invoke-Curl -ExtraArgs @('-L') -OutputFile '${{ env.TCL_DOWNLOAD_FILE }}' -Url '${{ env.TCL_DOWNLOAD_DIR }}${{ env.TCL_DOWNLOAD_FILE }}'
              Invoke-Curl -ExtraArgs @('-L') -OutputFile '${{ env.TK_DOWNLOAD_FILE }}'  -Url '${{ env.TCL_DOWNLOAD_DIR }}${{ env.TK_DOWNLOAD_FILE }}'
          }
          Invoke-Curl -ExtraArgs @('-L') -OutputFile '${{ env.TCLLIB_DOWNLOAD_FILE }}' -Url '${{ env.TCLLIB_DOWNLOAD_DIR }}${{ env.TCLLIB_DOWNLOAD_FILE }}'
          Invoke-Curl -ExtraArgs @('-L') -OutputFile '${{ env.TKLIB_DOWNLOAD_FILE }}'  -Url '${{ env.TCLLIB_DOWNLOAD_DIR }}${{ env.TKLIB_DOWNLOAD_FILE }}'
          Invoke-Curl -ExtraArgs @('-L', '--ssl-no-revoke') -OutputFile '${{ env.IMG_DOWNLOAD_FILE }}'  -Url 'https://downloads.sourceforge.net/project/tkimg/tkimg/2.1/tkimg%202.1.1/Img-2.1.1.tar.gz'
          Invoke-Curl -ExtraArgs @('-L', '--ssl-no-revoke') -OutputFile '${{ env.TDOM_DOWNLOAD_FILE }}' -Url 'https://core.tcl-lang.org/tdom/tarball/${{ env.TDOM_DOWNLOAD_FILE }}'

          # Need to figure out OpenSSL dependency before we add this:
          #Invoke-Curl -ExtraArgs @('-L') -OutputFile ${{ env.TCLTLS_DOWNLOAD_FILE }} -Url "${{ env.TCLTLS_DOWNLOAD_DIR }}${{ env.TCLTLS_DOWNLOAD_FILE }}"
          echo "Done downloading source files.  LASTERRORCODE=$LASTERRORCODE"
          dir

      - name: Verify downloads
        if: 1 == 1
        shell: powershell
        run: |
          if (  '${{ matrix.tcl-tag }} ' -match 'main' ) {
            # This will be potentially different each time and is a test build anyway, no need to verify hash codes.
          } else {
            if ( (Get-FileHash "${{ env.TCL_DOWNLOAD_FILE }}" -Algorithm MD5).Hash -ne "${{ env.TCL_DOWNLOAD_HASH }}" ) {
              throw "MD5 Checksum hash check failed for ${{ env.TCL_DOWNLOAD_FILE }}"
            } else {
              echo "${{ env.TCL_DOWNLOAD_FILE }} successfully downloaded from SourceForge."
            }
            if ( (Get-FileHash "${{ env.TK_DOWNLOAD_FILE }}" -Algorithm MD5).Hash -ne "${{ env.TK_DOWNLOAD_HASH }}" ) {
              throw "MD5 Checksum hash check failed for ${{ env.TK_DOWNLOAD_FILE }}"
            } else {
              echo "${{ env.TK_DOWNLOAD_FILE }} successfully downloaded from SourceForge."
            }
            if ( (Get-FileHash "${{ env.TCLLIB_DOWNLOAD_FILE }}" -Algorithm MD5).Hash -ne "${{ env.TCLLIB_DOWNLOAD_HASH }}" ) {
              throw "MD5 Checksum hash check failed for ${{ env.TCLLIB_DOWNLOAD_FILE }}"
            } else {
              echo "${{ env.TCLLIB_DOWNLOAD_FILE }} successfully downloaded from SourceForge."
            }
            if ( (Get-FileHash "${{ env.TKLIB_DOWNLOAD_FILE }}" -Algorithm MD5).Hash -ne "${{ env.TKLIB_DOWNLOAD_HASH }}" ) {
              throw "MD5 Checksum hash check failed for ${{ env.TKLIB_DOWNLOAD_FILE }}"
            } else {
              echo "${{ env.TKLIB_DOWNLOAD_FILE }} successfully downloaded from SourceForge."
            }
            # Need to figure out OpenSSL dependency before we add this:
            #if ( (Get-FileHash "${{ env.TCLTLS_DOWNLOAD_FILE }}" -Algorithm MD5).Hash -ne "${{ env.TCLTLS_DOWNLOAD_HASH }}" ) {
            #  #throw "MD5 Checksum hash check failed for ${{ env.TCLTLS_DOWNLOAD_FILE }}"
            #  echo "FileHash failed: ${{ env.TCLTLS_DOWNLOAD_HASH }}"
            #  Get-FileHash "${{ env.TCLTLS_DOWNLOAD_FILE }}" -Algorithm MD5
            #} else {
            #  echo "${{ env.TCLTLS_DOWNLOAD_FILE }} successfully downloaded from core.tcl-lang.org."
            #}
          }

      - name: Extract source archives
        shell: powershell
        run: |
          tar -xzf ${{ env.TCL_DOWNLOAD_FILE }}
          tar -xzf ${{ env.TK_DOWNLOAD_FILE }}
          if (  '${{ matrix.tcl-tag }} ' -match 'main' ) {
            # Download items included in the Tcl source distribution that come from different repos
            tar -xzf itcl-main.tar.gz -C ${{ env.TCL_BUILD_DIR }}/pkgs
            tar -xzf tdbc-main.tar.gz -C ${{ env.TCL_BUILD_DIR }}/pkgs
            tar -xzf tdbcodbc-main.tar.gz -C ${{ env.TCL_BUILD_DIR }}/pkgs
            tar -xzf tdbcmysql-main.tar.gz -C ${{ env.TCL_BUILD_DIR }}/pkgs
            tar -xzf tdbcpostgres-main.tar.gz -C ${{ env.TCL_BUILD_DIR }}/pkgs
            tar -xzf tdbcsqlite3-main.tar.gz -C ${{ env.TCL_BUILD_DIR }}/pkgs
            tar -xzf thread-main.tar.gz -C ${{ env.TCL_BUILD_DIR }}/pkgs
            tar -xzf sqlite3-main.tar.gz -C ${{ env.TCL_BUILD_DIR }}/pkgs
          }
          tar -xzf ${{ env.TCLLIB_DOWNLOAD_FILE }}
          tar -xzf ${{ env.TKLIB_DOWNLOAD_FILE }}
          tar -xzf ${{ env.IMG_DOWNLOAD_FILE }}
          tar -xzf ${{ env.TDOM_DOWNLOAD_FILE }}
          # Need to figure out OpenSSL build before we try this:
          # tar -xzf ${{ env.TCLTLS_DOWNLOAD_FILE }} -C ${{ env.TCL_BUILD_DIR }}/pkgs
          dir
          dir ${{ env.TCL_BUILD_DIR }}/pkgs
          
      - name: Init MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Build Tcl and included libraries (${{ matrix.config }})
        run: |
          &nmake -f makefile.vc release ${{ matrix.config }} INSTALLDIR=$Env:INSTALLDIR
          if ($lastexitcode -ne 0) {
             throw "nmake exit code: $lastexitcode"
          }
        working-directory: ${{ env.TCL_BUILD_DIR }}/win

      - name: Build Tk (${{ matrix.config }})
        run: |
          &nmake -f makefile.vc release ${{ matrix.config }} INSTALLDIR=$Env:INSTALLDIR TCLDIR=..\..\$Env:TCL_BUILD_DIR
          if ($lastexitcode -ne 0) {
             throw "nmake exit code: $lastexitcode"
          }
        working-directory: ${{ env.TK_BUILD_DIR }}/win

      - name: Build Img (${{ matrix.config }})
        run: |
          &nmake -f makefile.vc all ${{ matrix.config }} INSTALLDIR=$Env:INSTALLDIR TCLDIR=..\..\$Env:TCL_BUILD_DIR TKDIR=..\..\$Env:TK_BUILD_DIR
          if ($lastexitcode -ne 0) {
             throw "nmake exit code: $lastexitcode"
          }
        working-directory: ${{ env.IMG_BUILD_DIR }}/win

      - name: Build tDom (${{ matrix.config }})
        run: |
          &nmake -f makefile.vc ${{ matrix.config }} INSTALLDIR=$Env:INSTALLDIR TCLDIR=..\..\$Env:TCL_BUILD_DIR
          if ($lastexitcode -ne 0) {
             throw "nmake exit code: $lastexitcode"
          }
        working-directory: ${{ env.TDOM_BUILD_DIR }}/win

      - name: Build Test Harness ${{ matrix.config }}
        if: 1 == 0
        run: |
          &nmake -f makefile.vc ${{ matrix.config }} tcltest
          if ($lastexitcode -ne 0) {
             throw "nmake exit code: $lastexitcode"
          }
        timeout-minutes: 5
        working-directory: ${{ env.TCL_BUILD_DIR }}/win

      - name: Run Tests ${{ matrix.config }}
        if: 1 == 0
        run: |
          Write-Output "::add-matcher::.github\tcltest.json"
          &nmake -f makefile.vc ${{ matrix.config }} test
          if ($lastexitcode -ne 0) {
             throw "nmake exit code: $lastexitcode"
          }
        timeout-minutes: 30
        working-directory: ${{ env.TCL_BUILD_DIR }}/win
        env:
          ERROR_ON_FAILURES: 1

      - name: Install Tcl (${{ matrix.config }})
        run: |
          &nmake -f makefile.vc install ${{ matrix.config }} INSTALLDIR=$Env:INSTALLDIR
          if ($lastexitcode -ne 0) {
             throw "nmake exit code: $lastexitcode"
          }
        working-directory: ${{ env.TCL_BUILD_DIR }}/win

      - name: Install Tk (${{ matrix.config }})
        run: |
          &nmake -f makefile.vc install ${{ matrix.config }} INSTALLDIR=$Env:INSTALLDIR TCLDIR=..\..\$Env:TCL_BUILD_DIR
          if ($lastexitcode -ne 0) {
             throw "nmake exit code: $lastexitcode"
          }
        working-directory: ${{ env.TK_BUILD_DIR }}/win

      - name: Install Img (${{ matrix.config }})
        run: |
          &nmake -f makefile.vc install ${{ matrix.config }} INSTALLDIR=$Env:INSTALLDIR TCLDIR=..\..\$Env:TCL_BUILD_DIR TKDIR=..\..\$Env:TK_BUILD_DIR
          if ($lastexitcode -ne 0) {
             throw "nmake exit code: $lastexitcode"
          }
        working-directory: ${{ env.IMG_BUILD_DIR }}/win

      - name: Install tDom (${{ matrix.config }})
        run: |
          &nmake -f makefile.vc install ${{ matrix.config }} INSTALLDIR=$Env:INSTALLDIR TCLDIR=..\..\$Env:TCL_BUILD_DIR
          if ($lastexitcode -ne 0) {
             throw "nmake exit code: $lastexitcode"
          }
        working-directory: ${{ env.TDOM_BUILD_DIR }}/win
        
      - name: Install tcllib and tklib
        if: 1 == 1
        shell: powershell
        run: |
            ${{ env.TCLSH }} ${{ env.TCL_BUILD_DIR }}/pkgs/${{ env.TCLLIB_BUILD_DIR }}/installer.tcl -no-gui -no-html -no-examples -pkgs -pkg-path ${{ env.INSTALLDIR }}/lib -no-apps -no-nroff -no-wait
            ${{ env.TCLSH }} ${{ env.TCL_BUILD_DIR }}/pkgs/${{ env.TKLIB_BUILD_DIR }}/installer.tcl -no-gui -no-html -no-examples -pkgs -pkg-path ${{ env.INSTALLDIR }}/lib -no-apps -no-nroff -no-wait
        working-directory: .

      - name: Generate Installed file manifest for Install Test.
        shell: powershell
        run: |
            ${{ env.TCLSH }} ${{ env.INSTALLDIR }} tcl_installer_files.txt
            pwd
            dir
        working-directory: .

      - name: Upload distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: "Tcl-Tk Release Distribution (Win64)"
          path: ${{ env.INSTALLDIR }}


      # -----------------------------------------------------------------------
      # Installer build
      # -----------------------------------------------------------------------

      - name: Install Inno Setup
        run: |
          # Inno Setup 6 is not pre-installed on windows-2025 runners.
          # Chocolatey is available on all GitHub-hosted Windows runners.
          choco install innosetup --yes --no-progress
          if ($lastexitcode -ne 0) {
            throw "Inno Setup installation failed (exit code $lastexitcode)"
          }
          # Add ISCC to PATH for subsequent steps
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\Inno Setup 6"

      - name: Build Installer
        run: |
          # Drive ISCC entirely via /D defines so the .iss file itself needs no
          # edits when the Tcl version changes.
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion="${{ env.TCL_VERSION }}" `
            /DMyMajorMinor="${{ env.TCL_MAJOR_MINOR }}" `
            /DMyInstallDir="${{ env.INSTALLDIR }}" `
            /DMyIconFile="${{ github.workspace }}\${{ env.TCL_BUILD_DIR }}\win\tclsh.ico" `
            /DMyAppGuid="${{ env.TCL_APP_GUID }}" `
            ".github\tcl_windows.iss"
          if ($lastexitcode -ne 0) {
            throw "ISCC.exe exit code: $lastexitcode"
          }
        working-directory: .
          

      - name: Upload unsigned installer for signing
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: "Tcl-Tk-unsigned"
          path: ".github/Output/Tcl-Tk-${{ env.TCL_VERSION }}-win64-setup.exe"

      - name: Sign installer via SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '743c7475-eba0-4faf-8370-3c0574005a3f'
          project-slug: 'tcl_release'
          signing-policy-slug: 'test-signing'
          github-artifact-id: '${{ steps.upload-unsigned-installer.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: '.github/Output/signed'

      - name: Upload signed installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: "Tcl-Tk Windows Installer (Win64, signed)"
          path: ".github/Output/signed/Tcl-Tk-${{ env.TCL_VERSION }}-win64-setup.exe"
          
      # -----------------------------------------------------------------------
      # Installer test
      # -----------------------------------------------------------------------
      - name: Test Installer
        run: |
          .github\test_installer.ps1
          if ($lastexitcode -ne 0) {
            throw "Installer test suite failed (exit code $lastexitcode)"
          }
        working-directory: .  



