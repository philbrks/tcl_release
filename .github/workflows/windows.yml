name: Windows
on:
  workflow_dispatch:
    inputs:
      tcl-tags:
        required: true
        type: choice
        options:
          - '["9.0"]'
          - '["9.1"]'
          - '["main"]'
        default: '["main"]'

permissions:
  contents: read
  actions: write # needed to trigger another workflow via `gh workflow run`
env:
  ERROR_ON_FAILURES: 1

jobs:
  msvc:
    runs-on: windows-2025
    defaults:
      run:
        shell: powershell

    strategy:
      matrix:
        config:
          - ""
        tcl-tag: ${{ fromJSON(github.event.inputs.tcl-tags) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        timeout-minutes: 5

      - name: Load build variables from JSON
        run: |
          $tag = '${{ matrix.tcl-tag }}'
          $varsFile = ".github/build-vars-tcl-$tag.json"

          echo "Loading build variables from $varsFile"
          if (-not (Test-Path $varsFile)) {
            throw "Build vars file not found: $varsFile"
          }
          $vars = Get-Content $varsFile | ConvertFrom-Json
          foreach ($prop in $vars.PSObject.Properties) {
            echo "Setting $($prop.Name)=$($prop.Value)"
            Add-Content -Path $env:GITHUB_ENV -Value "$($prop.Name)=$($prop.Value)"
          }

          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_VARS_FILE=$varsFile"

          New-Item -Path bld -ItemType Directory
          copy $varsFile bld\build-vars.json
          copy build_windows.ps1 bld

        working-directory: .

      - name: Set fixed environment variables
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "INSTALLDIR=C:\Tcl-tk"
          Add-Content -Path $env:GITHUB_ENV -Value "SSL_INSTALL_FOLDER=C:\OpenSSL"
          Add-Content -Path $env:GITHUB_ENV -Value "TCL_APP_GUID=B4D6AEFE-3B8C-4B64-B1BD-B45A3442A79C"
        working-directory: .

      - name: Try to download OpenSSL artifact
        id: download-ossl
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          workflow: OpenSSL-Windows.yml
          workflow_conclusion: success
          name: "OpenSSL-Windows-Install"
          path: "C:\\OpenSSL"

      - name: Trigger OpenSSL rebuild if artifact missing or expired
        if: steps.download-ossl.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Output "No usable OpenSSL artifact found (missing or expired)."
          Write-Output "Triggering OpenSSL-Windows.yml to rebuild it now..."
          gh workflow run OpenSSL-Windows.yml --ref ${{ github.ref_name }}
          if ($lastexitcode -ne 0) {
            throw "Failed to trigger OpenSSL-Windows.yml rebuild, exit code: $lastexitcode"
          }
          throw "OpenSSL artifact was unavailable, so a rebuild has been triggered. Please wait for OpenSSL-Windows.yml to complete, then re-run this workflow."

      - name: Verify OpenSSL restore
        run: |
          if (-not (Test-Path "C:\OpenSSL\bin")) {
            throw "OpenSSL install directory was not restored correctly to C:\OpenSSL"
          }
          echo "OpenSSL restored:"
          dir C:\OpenSSL      

      - name: Download All source
        shell: powershell
        run: |
          function Get-Download {
              param(
                  [string]$OutputFile,
                  [string]$Url
              )
              echo "Downloading $Url to $OutputFile"
              curl.exe -L --ssl-no-revoke -o $OutputFile $Url
              if ($LASTEXITCODE -ne 0) {
                  Write-Error "curl failed (exit code $LASTEXITCODE) downloading '$Url' to '$OutputFile'"
                  throw $LASTEXITCODE
              }
              echo "Done downloading $Url to $OutputFile"
          }
          New-Item -Path downloads -ItemType Directory

          Get-Download -OutputFile 'downloads\${{ env.TCL_DOWNLOAD_FILE }}'  -Url '${{ env.TCL_DOWNLOAD_URL }}'
          Get-Download -OutputFile 'downloads\${{ env.TK_DOWNLOAD_FILE }}'   -Url '${{ env.TK_DOWNLOAD_URL }}'

          if ('${{ matrix.tcl-tag }} ' -match 'main') {
              Get-Download -OutputFile 'downloads\itcl-main.tar.gz'              -Url 'https://core.tcl-lang.org/itcl/tarball/itcl-main.tar.gz'
              Get-Download -OutputFile 'downloads\tdbc-main.tar.gz'              -Url 'https://core.tcl-lang.org/tdbc/tarball/tdbc-main.tar.gz'
              Get-Download -OutputFile 'downloads\tdbcodbc-main.tar.gz'          -Url 'https://core.tcl-lang.org/tdbcodbc/tarball/tdbcodbc-main.tar.gz'
              Get-Download -OutputFile 'downloads\tdbcmysql-main.tar.gz'         -Url 'https://core.tcl-lang.org/tdbcmysql/tarball/tdbcmysql-main.tar.gz'
              Get-Download -OutputFile 'downloads\tdbcsqlite3-main.tar.gz'       -Url 'https://core.tcl-lang.org/tdbcsqlite3/tarball/tdbcsqlite3-main.tar.gz'
              Get-Download -OutputFile 'downloads\tdbcpostgres-main.tar.gz'      -Url 'https://core.tcl-lang.org/tdbcpostgres/tarball/tdbcpostgres-main.tar.gz'
              Get-Download -OutputFile 'downloads\thread-main.tar.gz'            -Url 'https://core.tcl-lang.org/thread/tarball/thread-main.tar.gz'
              Get-Download -OutputFile 'downloads\sqlite3-main.tar.gz'           -Url 'https://cyqlite.sourceforge.io/cgi-bin/sqlite/tarball/sqlite3-main.tar.gz'
          }

          Get-Download -OutputFile 'downloads\${{ env.TCLTLS_DOWNLOAD_FILE }}' -Url '${{ env.TCLTLS_DOWNLOAD_URL }}'
          Get-Download -OutputFile 'downloads\${{ env.CRITCL_DOWNLOAD_FILE }}' -Url '${{ env.CRITCL_DOWNLOAD_URL }}'
          Get-Download -OutputFile 'downloads\${{ env.TCLLIB_DOWNLOAD_FILE }}' -Url '${{ env.TCLLIB_DOWNLOAD_URL }}'
          Get-Download -OutputFile 'downloads\${{ env.TKLIB_DOWNLOAD_FILE }}'  -Url '${{ env.TKLIB_DOWNLOAD_URL }}'
          Get-Download -OutputFile 'downloads\${{ env.IMG_DOWNLOAD_FILE }}'    -Url '${{ env.IMG_DOWNLOAD_URL }}'
          Get-Download -OutputFile 'downloads\${{ env.TDOM_DOWNLOAD_FILE }}'   -Url '${{ env.TDOM_DOWNLOAD_URL }}'
          Get-Download -OutputFile 'downloads\${{ env.TKTABLE_DOWNLOAD_FILE }}' -Url '${{ env.TKTABLE_DOWNLOAD_URL }}'
          Get-Download -OutputFile 'downloads\${{ env.TCLUDP_DOWNLOAD_FILE }}' -Url '${{ env.TCLUDP_DOWNLOAD_URL }}'
          Get-Download -OutputFile 'downloads\${{ env.TWAPI_DOWNLOAD_FILE }}' -Url '${{ env.TWAPI_DOWNLOAD_URL }}'
          Get-Download -OutputFile 'downloads\${{ env.TKTREECTRL_DOWNLOAD_FILE }}' -Url '${{ env.TKTREECTRL_DOWNLOAD_URL }}'

          echo "Done downloading source files."

      - name: Verify downloads
        if: 1 == 1
        shell: powershell
        run: |
          function Verify-Download {
              param(
                  [string]$DownloadFile,
                  [string]$DownloadHash
              )
              if ( $DownloadHash -ne "SKIP" ) {
                  echo "Verifying $DownloadFile"
                  $FileHash = (Get-FileHash $DownloadFile -Algorithm MD5).HASH
                  if ( $FileHash -ne $DownloadHash ) {
                      Write-Error "MD5 hash check failed for $DownloadFile"
                      throw 14
                  }
              }
          }

          Verify-Download "downloads\${{ env.TCL_DOWNLOAD_FILE }}"   "${{ env.TCL_DOWNLOAD_HASH }}"
          Verify-Download "downloads\${{ env.TK_DOWNLOAD_FILE }}"    "${{ env.TK_DOWNLOAD_HASH }}"
          Verify-Download "downloads\${{ env.TCLTLS_DOWNLOAD_FILE }}" "${{ env.TCLTLS_DOWNLOAD_HASH }}"
          Verify-Download "downloads\${{ env.CRITCL_DOWNLOAD_FILE }}" "${{ env.CRITCL_DOWNLOAD_HASH }}"
          Verify-Download "downloads\${{ env.TCLLIB_DOWNLOAD_FILE }}" "${{ env.TCLLIB_DOWNLOAD_HASH }}"
          Verify-Download "downloads\${{ env.TKLIB_DOWNLOAD_FILE }}" "${{ env.TKLIB_DOWNLOAD_HASH }}"
          Verify-Download "downloads\${{ env.IMG_DOWNLOAD_FILE }}" "${{ env.IMG_DOWNLOAD_HASH }}"
          Verify-Download "downloads\${{ env.TDOM_DOWNLOAD_FILE }}" "${{ env.TDOM_DOWNLOAD_HASH }}"
          Verify-Download "downloads\${{ env.TKTABLE_DOWNLOAD_FILE }}" "${{ env.TKTABLE_DOWNLOAD_HASH }}"
          Verify-Download "downloads\${{ env.TCLUDP_DOWNLOAD_FILE }}" "${{ env.TCLUDP_DOWNLOAD_HASH }}"
          Verify-Download "downloads\${{ env.TWAPI_DOWNLOAD_FILE }}" "${{ env.TWAPI_DOWNLOAD_HASH }}"
          Verify-Download "downloads\${{ env.TKTREECTRL_DOWNLOAD_FILE }}" "${{ env.TKTREECTRL_DOWNLOAD_HASH }}"

      - name: Extract source archives
        shell: powershell
        run: |
          function Extract-Download {
            param(
                [string]$DownloadFile,
                [string]$ExtraArg
            )
            echo "Extracting $DownloadFile $ExtraArg"
            tar -zxf $DownloadFile $ExtraArg
            if ($lastexitcode -ne 0) {
               throw "tar exit code: $lastexitcode"
            }
          }
          Extract-Download '..\downloads\${{ env.TCL_DOWNLOAD_FILE }}'
          Extract-Download '..\downloads\${{ env.TK_DOWNLOAD_FILE }}'
          if ('${{ matrix.tcl-tag }} ' -match 'main') {
            Extract-Download ..\downloads\itcl-main.tar.gz    "-C${{ env.TCL_BUILD_DIR }}/pkgs"
            Extract-Download ..\downloads\tdbc-main.tar.gz    "-C${{ env.TCL_BUILD_DIR }}/pkgs"
            Extract-Download ..\downloads\tdbcodbc-main.tar.gz    "-C${{ env.TCL_BUILD_DIR }}/pkgs"
            Extract-Download ..\downloads\tdbcmysql-main.tar.gz   "-C${{ env.TCL_BUILD_DIR }}/pkgs"
            Extract-Download ..\downloads\tdbcpostgres-main.tar.gz "-C${{ env.TCL_BUILD_DIR }}/pkgs"
            Extract-Download ..\downloads\tdbcsqlite3-main.tar.gz "-C${{ env.TCL_BUILD_DIR }}/pkgs"
            Extract-Download ..\downloads\thread-main.tar.gz  "-C${{ env.TCL_BUILD_DIR }}/pkgs"
            Extract-Download ..\downloads\sqlite3-main.tar.gz "-C${{ env.TCL_BUILD_DIR }}/pkgs"
          }
          Extract-Download '..\downloads\${{ env.TCLTLS_DOWNLOAD_FILE }}'
          Extract-Download '..\downloads\${{ env.CRITCL_DOWNLOAD_FILE }}'
          Extract-Download '..\downloads\${{ env.TCLLIB_DOWNLOAD_FILE }}'
          Extract-Download '..\downloads\${{ env.TKLIB_DOWNLOAD_FILE }}'
          Extract-Download '..\downloads\${{ env.IMG_DOWNLOAD_FILE }}'
          Extract-Download '..\downloads\${{ env.TDOM_DOWNLOAD_FILE }}'
          Extract-Download '..\downloads\${{ env.TKTABLE_DOWNLOAD_FILE }}'
          Extract-Download '..\downloads\${{ env.TCLUDP_DOWNLOAD_FILE }}'
          Extract-Download '..\downloads\${{ env.TWAPI_DOWNLOAD_FILE }}'
          Extract-Download '..\downloads\${{ env.TKTREECTRL_DOWNLOAD_FILE }}'

          cd ..
          tar cf Tcl-Tk-and-libraries.tar.gz bld

        working-directory: bld

      - name: Upload Full Source Tree
        uses: actions/upload-artifact@v7.0.1
        with:
          name: "Tcl-Tk Release Distribution (Source)"
          path: Tcl-Tk-and-libraries.tar.gz
          archive: false

      - name: Init MSVC
        run: |
          $installPath = vswhere -latest -property installationPath
          echo "VCVARSALL_PATH=$installPath\VC\Auxiliary\Build\vcvarsall.bat" >> $env:GITHUB_ENV
          
      - name: Build and install Tcl and included libraries (${{ matrix.config }})
        run: |

          ${Env:BUILD_CONFIG} = "${{ matrix.config }}"
          &"$env:VCVARSALL_PATH x64"
          .\build_windows.ps1

        working-directory: bld

      - name: Generate Installed file manifest for Install Test
        shell: powershell
        run: |
          ${{ env.TCLSH }} ${{ github.workspace }}\.github\generate_manifest.tcl ${{ env.INSTALLDIR }} tcl_installer_files.txt
          if ($lastexitcode -ne 0) { throw "generate_manifest exit code: $lastexitcode" }
        working-directory: .

      - name: Upload distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: "Tcl-Tk Release Distribution (Win64)"
          path: ${{ env.INSTALLDIR }}

      # -----------------------------------------------------------------------
      # Installer build
      # -----------------------------------------------------------------------

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
          if ($lastexitcode -ne 0) { throw "Inno Setup installation failed (exit code $lastexitcode)" }
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\Inno Setup 6"

      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion="${{ env.TCL_VERSION }}" `
            /DMyMajorMinor="${{ env.TCL_MAJOR_MINOR }}" `
            /DMyInstallDir="${{ env.INSTALLDIR }}" `
            /DMyIconFile="${{ github.workspace }}\bld\${{ env.TCL_BUILD_DIR }}\win\tclsh.ico" `
            /DMyAppGuid="${{ env.TCL_APP_GUID }}" `
            ".github\tcl_windows.iss"
          if ($lastexitcode -ne 0) { throw "ISCC.exe exit code: $lastexitcode" }
        working-directory: .

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: "Tcl-Tk-unsigned"
          path: ".github/Output/Tcl-Tk-${{ env.TCL_MAJOR_MINOR }}-win64-setup.exe"

      - name: Upload build variables for signing workflow
        uses: actions/upload-artifact@v7.0.1
        with:
          name: "build-vars"
          path: "bld/build-vars.json"

      # -----------------------------------------------------------------------
      # Installer test
      # -----------------------------------------------------------------------
      - name: Test Installer
        run: |
          .github\test_installer.ps1
          if ($lastexitcode -ne 0) { throw "Installer test suite failed (exit code $lastexitcode)" }
        working-directory: .
